# The whole stack: PostgreSQL, a one-shot migration, the API, and the web app
# behind nginx. Copy `.env.example` to `.env`, set `JWT_SECRET`, then:
#
#   docker compose up --build -d
#
# and open http://localhost:8080 (or the `WEB_PORT` you chose). Only the web
# service publishes a port: the browser reaches the API through its `/api`
# proxy, and the database is reachable only inside the stack.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: openhouse
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username=postgres --dbname=openhouse']
      interval: 5s
      timeout: 5s
      retries: 12

  # Applies pending migrations, then exits. The API starts only once it has
  # succeeded, so a deployment never serves a schema it does not know.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/openhouse
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/openhouse
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      # The web service's nginx is one proxy hop; add one per proxy you put
      # in front of it (a TLS terminator makes it 2).
      APP_TRUST_PROXY_HOPS: ${APP_TRUST_PROXY_HOPS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  db-data:
