# The web image's server: serves the static build and forwards `/api` to the
# API, the same shape the Vite dev server proxies in development. The page
# and the API share one origin, so the session cookies are never cross-site.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The API's routes carry no `/api` prefix: the trailing slash on
  # `proxy_pass` strips it, as the dev proxy's rewrite does.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Appends the client to the chain, so the API — trusting the hops
    # `APP_TRUST_PROXY_HOPS` names — rate-limits each client, not this proxy.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The service worker and the shell must revalidate on every load, or a
  # browser keeps running the previous deployment.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Vite fingerprints everything under /assets: safe to cache for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes (/transactions, /limits, …) all load the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
