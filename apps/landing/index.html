<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#0a0a0a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#f2f2f0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="OpenHouse keeps every account and credit card your household uses in one shared ledger. It records the recurring bills, adds up each card bill as you spend, and reminds you before anything is due. Free to start, open source, and free forever if you host it yourself."
    />
    <script>
      // Resolve the theme before first paint so a dark-mode visitor never
      // sees a white flash; ThemeProvider takes over once React mounts.
      ;(() => {
        const stored = localStorage.getItem('theme')
        const dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      })()
    </script>
    <title>OpenHouse | Household money, shared</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
