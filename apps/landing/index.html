<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#0a0a0a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#f2f2f0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="OpenHouse is an open-source household finance app: accounts, transactions, limits, goals, and planners — self-host it for free or let us run it for you."
    />
    <script>
      // Resolve the theme before first paint so a dark-mode visitor never
      // sees a white flash; ThemeProvider takes over once React mounts.
      ;(() => {
        const stored = localStorage.getItem('theme')
        const dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      })()
    </script>
    <title>OpenHouse — open-source household finance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
