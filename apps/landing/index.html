<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#c2552f" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#f7f2ea"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1c1714"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Kantim is your home’s assistant. It keeps your money, bills, health, family, pets, tasks, upkeep and food in one place, and it remembers what’s due so you don’t have to. Free to start, open source, and free forever if you host it yourself."
    />
    <script>
      // Resolve the theme before first paint so a dark-mode visitor never
      // sees a white flash; ThemeProvider takes over once React mounts.
      ;(() => {
        const stored = localStorage.getItem('theme')
        const dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      })()
    </script>
    <title>Kantim | Your home, looked after</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
