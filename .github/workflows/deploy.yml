# Deploys both Workers on demand only (Actions → deploy → Run workflow): checks first,
# then builds every app (the app Worker serves apps/web/dist as its assets,
# the landing Worker apps/landing/dist), applies the D1 migrations to the
# remote database BEFORE shipping the new bundle — the expand/contract order
# the contract requires — and deploys the app Worker, then the landing.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts,
# D1, Workers Routes and Queues edit on the account; Zone read on
# couralabs.dev) and CLOUDFLARE_ACCOUNT_ID. Worker secrets (JWT_SECRET,
# TURNSTILE_SECRET, ENVIRONMENT, …) live on the Worker and are untouched.
name: deploy

on:
  # Deploys are manual for now (`npm run build && npm run deploy` from a
  # machine signed in with wrangler); re-add `push: branches: [master]` once
  # the repository has the Cloudflare secrets.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck && npm run lint && npm run test

      - name: Build the apps
        run: npm run build

      - name: Check the Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            exit 1
          fi

      - name: Apply pending migrations (before the deploy)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy the app Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy the landing Worker
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
